name: Issue 3 lockfile bootstrap

on:
  push:
    branches:
      - feat/3-atomic-capacity-idempotency

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@7f84f1d52d0c56afb45c62fee31a93b843cea4d6
        with:
          node-version: 22
          cache: npm

      - name: Generate PostgreSQL dependency lockfile
        run: |
          npm install pg --workspace @teste2/api
          npm install --save-dev @types/pg --workspace @teste2/api

      - name: Commit generated manifest and lockfile
        run: |
          if git diff --quiet -- apps/api/package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/package.json package-lock.json
          git commit -m "chore: add PostgreSQL client dependency"
          git push origin HEAD:${GITHUB_REF_NAME}
