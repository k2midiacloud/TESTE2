name: Bootstrap Lockfile

on:
  push:
    branches:
      - chore/1-preparar-laboratorio
    paths:
      - package.json
      - apps/api/package.json
      - .github/workflows/bootstrap-lock.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Node
        uses: actions/setup-node@7f84f1d52d0c56afb45c62fee31a93b843cea4d6
        with:
          node-version: 22

      - name: Generate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate generated lockfile
        run: npm ci --ignore-scripts

      - name: Commit npm-generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "chore: generate npm lockfile"
            git push
          fi
