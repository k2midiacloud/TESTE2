name: Bootstrap Lockfile

on:
  push:
    branches:
      - chore/1-preparar-laboratorio

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Node
        uses: actions/setup-node@7f84f1d52d0c56afb45c62fee31a93b843cea4d6
        with:
          node-version: 22

      - name: Generate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
